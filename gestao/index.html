<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão — Equilibrium Mais Saúde</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon-multi.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-multi-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-multi.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1B6CB3;--azul:#1B6CB3;--azul-d:#134B80;--azul-l:#4E93C8;--aqua:#3FAEC6;
  --ambar:#E8912E;--ambar-d:#B9721F;--coral:#E24C4C;
  --ink:#1C2B3A;--muted:#6C7E90;--muted2:#9AACBC;--line:#E7EEF6;--mist:#F1F6FC;--bg:#F1F6FB;--surface:#FFFFFF;--brand-l:#EAF2FB;
  --ok:#1E9E6A;--okbg:#E7F7EF;--risk:#E24C4C;--riskbg:#FCEBEB;--warn:#E8912E;--warnbg:#FDF3E5;
  --sb-w:250px;--r:16px;--r-sm:12px;
  --sh1:0 2px 10px rgba(19,75,128,.05);--sh2:0 14px 34px rgba(19,75,128,.12);--shh:0 18px 44px rgba(19,75,128,.16);
  --t:.18s cubic-bezier(.2,.7,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Inter',sans-serif;font-weight:700}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d3e2f0;border-radius:6px}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sb-w);background:linear-gradient(180deg,#123F73,#1B6CB3);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.sb-brand{position:relative;overflow:hidden;padding:24px 20px 16px}
.sb-brand .cvbg{display:none}
.sb-brand .row{position:relative;display:flex;align-items:center;gap:11px;z-index:2;color:#fff}
.sb-brand .nm{font-weight:800;font-size:17px;line-height:1.1;color:#fff}
.sb-brand .nm span{opacity:.82;font-weight:600}
.sb-brand .tag{position:relative;z-index:2;display:inline-block;margin-top:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:999px;font-weight:700;color:#fff}
.sb-nav{flex:1;padding:10px 12px;overflow-y:auto}
.sb-nav .grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700;padding:16px 12px 6px}
.sb-nav button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 13px;border-radius:12px;font-weight:500;font-size:14.5px;color:#D7E6F5;cursor:pointer;transition:var(--t);margin-bottom:3px;position:relative}
.sb-nav .nic{width:19px;height:19px;flex-shrink:0}
.sb-nav button .ico{font-size:17px;width:22px;text-align:center}
.sb-nav button:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateX(2px)}
.sb-nav button.on{background:#fff;color:var(--azul-d);font-weight:600;box-shadow:var(--sh1)}
.sb-nav button.on .nic{color:var(--azul)}
.sb-nav button .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--coral);color:#fff;border-radius:999px;padding:1px 8px}
.sb-foot{padding:14px 16px}
.sb-foot .vinfo{font-size:11px;color:rgba(255,255,255,.55);text-align:center}

/* MAIN */
.main{flex:1;margin-left:var(--sb-w);min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 30px;height:68px;display:flex;align-items:center;gap:16px}
.topbar .crumb{font-size:14px;color:var(--muted)}
.topbar .crumb b{color:var(--ink);font-weight:700;font-size:16px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hamb{display:none;border:none;background:none;font-size:22px;cursor:pointer;color:var(--azul)}
.userchip{display:flex;align-items:center;gap:10px;font-size:13.5px}
.userchip .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--aqua));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;position:relative;overflow:visible;flex-shrink:0}
.userchip .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.userchip .av .badge-foto{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.userchip .av:hover .cam{opacity:1}
.userchip .av .cam{position:absolute;inset:0;border-radius:50%;background:rgba(19,75,128,.55);display:flex;align-items:center;justify-content:center;font-size:15px;opacity:0;transition:var(--t)}
.userchip .nm{font-weight:600}.userchip .rl{font-size:11.5px;color:var(--muted)}
.btn-out{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:var(--t)}
.btn-out:hover{background:var(--riskbg);color:var(--risk);border-color:#f3c9c9}
.btn-recep{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--azul);cursor:pointer;transition:var(--t);display:none;align-items:center;gap:7px}
.btn-recep:hover{background:var(--brand-l);border-color:#bcd8f0}
.btn-recep .ic{font-size:15px}
.content{padding:30px;flex:1;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.sec-h h1{font-size:25px;font-weight:800;color:var(--azul-d);letter-spacing:-.4px}
.sec-h p{color:var(--muted);font-size:14px;margin-top:3px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border-radius:var(--r);padding:20px;border:1px solid var(--line);position:relative;overflow:hidden;transition:var(--t);box-shadow:var(--sh1)}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shh);border-color:#d5e4f2}
.kpi .chip{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
.kpi.c1 .chip{background:var(--brand-l);color:var(--brand)}
.kpi.c2 .chip{background:var(--okbg);color:var(--ok)}
.kpi.c3 .chip{background:var(--warnbg);color:var(--warn)}
.kpi.c4 .chip{background:#E4F4F8;color:var(--aqua)}
.kpi .v{font-weight:800;font-size:28px;color:var(--ink);line-height:1;letter-spacing:-.5px}
.kpi .l{font-size:13px;color:var(--muted);margin-top:6px}
.kpi .cvmini{display:none}

/* CARDS / GRID */
.grid{display:grid;gap:18px;margin-top:18px}
.g-2-1{grid-template-columns:1.6fr 1fr}
.g-1-1{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh1)}
.card .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.card h3{font-size:16px;font-weight:700;color:var(--azul-d)}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.tag-soft{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--brand-l);color:var(--azul)}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{position:relative;width:150px;height:150px;flex-shrink:0}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr .n{font-weight:800;font-size:26px;color:var(--azul-d)}
.donut .ctr .t{font-size:11px;color:var(--muted)}
.legend{flex:1;display:flex;flex-direction:column;gap:11px}
.legend .it{display:flex;align-items:center;gap:10px;font-size:13.5px}
.legend .it .dot{width:11px;height:11px;border-radius:4px}
.legend .it b{margin-left:auto;font-weight:700;color:var(--azul-d)}
.legend .it span{color:var(--muted);font-size:12px;margin-left:4px}

/* BARS */
.barline{margin-bottom:15px}
.barline .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.barline .top b{color:var(--ink);font-weight:600}.barline .top span{color:var(--muted);font-size:12px}
.barline .track{height:10px;background:var(--mist);border-radius:999px;overflow:hidden}
.barline .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--azul),var(--aqua));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ATENÇÃO */
.attn{display:flex;flex-direction:column;gap:10px}
.attn .it{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;background:var(--mist);transition:var(--t)}
.attn .it:hover{background:#e9f2fb;transform:translateX(2px)}
.attn .it .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attn .it.warn .ic{background:var(--warnbg);color:var(--warn)}
.attn .it.risk .ic{background:var(--riskbg);color:var(--risk)}
.attn .it .tx{flex:1;min-width:0}
.attn .it .tx b{font-size:14px;display:block;font-weight:600}.attn .it .tx small{color:var(--muted);font-size:12px}
.attn .it .val{font-weight:700;color:var(--azul-d);font-size:14px}

/* TABELAS */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;flex:1;min-width:220px;transition:var(--t)}
.search:focus-within{border-color:var(--azul);box-shadow:0 0 0 4px rgba(27,108,179,.10)}
.search input{border:none;outline:none;font-family:'Inter';font-size:14px;width:100%;background:none}
.filt{display:flex;gap:6px}
.filt button{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:var(--t)}
.filt button:hover{border-color:#bcd8f0}
.filt button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:15px 18px;border-bottom:1px solid var(--line)}
tbody td{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:var(--t)}
tbody tr.clickable{cursor:pointer}
tbody tr:hover{background:var(--brand-l)}
.who{display:flex;align-items:center;gap:12px}
.who .a{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.who small{display:block;color:var(--muted);font-size:12px}
.who b{font-weight:600}
.pill{font-size:11.5px;padding:5px 12px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.ind{background:var(--okbg);color:#0F7A55}.pill.fam{background:var(--brand-l);color:#1b6cb3}.pill.gran{background:var(--warnbg);color:var(--ambar-d)}
.pill.gestor{background:#EDECFD;color:#5b50c9}.pill.financeiro{background:var(--okbg);color:#0F7A55}.pill.recepcao{background:var(--brand-l);color:#1b6cb3}
.stt{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stt .d{width:8px;height:8px;border-radius:50%}
.stt.ok{color:var(--ok)}.stt.ok .d{background:var(--ok)}
.stt.pend{color:var(--warn)}.stt.pend .d{background:var(--warn)}
.stt.canc{color:var(--risk)}.stt.canc .d{background:var(--risk)}
.chev{color:var(--muted2);font-size:18px}
.arrow{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;color:var(--azul);transition:transform .2s;font-size:11px;margin-right:6px;border-radius:6px;background:var(--brand-l)}
.arrow.open{transform:rotate(90deg)}
.arrow.none{opacity:0;pointer-events:none}
.resumo{display:inline-block;margin-left:9px;font-size:11px;color:var(--azul);background:var(--brand-l);padding:2px 9px;border-radius:999px;font-weight:600;vertical-align:middle}
.dep-row{background:#FAFCFE}.dep-row.hidden{display:none}
.dep-row td{font-size:13px}
.dep-row td:first-child{padding-left:48px;color:var(--muted);position:relative}
.dep-row td:first-child::before{content:"";position:absolute;left:28px;top:-6px;height:24px;width:12px;border-left:2px solid #cfe0f0;border-bottom:2px solid #cfe0f0;border-bottom-left-radius:6px}

/* DRAWER */
.drawer-bg{position:fixed;inset:0;background:rgba(19,75,128,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:90}
.drawer-bg.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:94vw;background:var(--bg);box-shadow:-20px 0 60px rgba(8,30,55,.3);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:91;overflow-y:auto}
.drawer.show{transform:translateX(0)}
.dr-head{background:linear-gradient(135deg,var(--azul-d),var(--azul));color:#fff;padding:26px 24px;position:relative;overflow:hidden}
.dr-head .cvbg{display:none}
.dr-head .x{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;z-index:3;transition:var(--t)}
.dr-head .x:hover{background:rgba(255,255,255,.3)}
.dr-head .who2{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.dr-head .who2 .a{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.dr-head .who2 .nm{font-weight:800;font-size:20px}
.dr-head .who2 small{opacity:.85;font-size:13px}
.dr-body{padding:20px}
.dr-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.dr-stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;box-shadow:var(--sh1)}
.dr-stat .v{font-weight:800;font-size:19px;color:var(--azul-d)}
.dr-stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.dr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh1)}
.dr-card h4{font-size:12px;color:var(--azul);text-transform:uppercase;letter-spacing:.06em;margin-bottom:13px;font-weight:700}
.dr-li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dr-li:last-child{border-bottom:none}
.dr-li .mini{width:30px;height:30px;border-radius:9px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;font-size:14px}
.dr-li .g{flex:1;min-width:0}.dr-li .g b{display:block;font-size:13.5px;font-weight:600}.dr-li .g small{color:var(--muted);font-size:11.5px}
.dr-li .r{text-align:right;font-size:12.5px}
.dr-eco{color:var(--ok);font-weight:700}

/* FORMS / EQUIPE */
.eq-grid{display:grid;grid-template-columns:0.78fr 1.6fr;gap:18px;align-items:start}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter';transition:var(--t)}
.field input:focus,.field select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(27,108,179,.10)}
.roles{display:flex;gap:8px}
.role-opt{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:var(--t)}
.role-opt:hover{border-color:#bcd8f0}
.role-opt.on{border-color:var(--azul);background:var(--brand-l);color:var(--azul)}
.btn-full{font-weight:700;border:none;border-radius:12px;padding:13px 18px;font-size:14px;cursor:pointer;width:100%;background:var(--azul);color:#fff;transition:var(--t);margin-top:6px;box-shadow:0 6px 16px rgba(27,108,179,.26);position:relative;overflow:hidden}
.btn-full:hover{background:#1a63a3;transform:translateY(-2px);box-shadow:0 12px 26px rgba(27,108,179,.34)}
.btn-full:active{transform:scale(.97)}
.btn-full:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
.msg{font-size:13.5px;border-radius:12px;padding:12px 14px;margin-top:14px;display:none}
.msg.err{background:var(--riskbg);color:var(--risk);display:block}
.msg.ok{background:var(--okbg);color:var(--ok);display:block}
.cred{background:var(--warnbg);border:1px solid #f0d3a4;border-radius:12px;padding:15px;margin-top:14px;display:none}
.cred.show{display:block}
.cred .l{font-size:12px;color:var(--ambar-d);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cred .v{font-weight:800;font-size:18px;color:var(--azul-d);margin-top:4px;word-break:break-all}
.cred .copy{margin-top:10px;border:1px solid #e6c187;background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ambar-d);cursor:pointer;transition:var(--t)}
.cred .copy:hover{background:#fff}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
#equipeBody td{padding:11px 14px}
.act{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--t)}
.act:hover{border-color:#bcd8f0}
.act.toggle{color:var(--ambar-d)}.act.toggle:hover{background:var(--warnbg)}
.act.del{color:var(--risk)}.act.del:hover{background:var(--riskbg);border-color:#f3c9c9}
.act:disabled{opacity:.4;cursor:not-allowed}
.tag-me{font-size:11px;color:var(--muted);background:var(--mist);padding:3px 9px;border-radius:999px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(19,75,128,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:var(--r);padding:28px;max-width:380px;width:90%;text-align:center;box-shadow:0 30px 70px rgba(8,30,55,.4)}
.modal .box h3{font-size:18px;color:var(--azul-d);margin-bottom:8px}
.modal .box p{font-size:14px;color:var(--muted);margin-bottom:20px}
.modal .acts{display:flex;gap:10px}
.modal .acts button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:var(--t)}
.modal .acts button:active{transform:scale(.97)}
.modal .cancel{background:var(--mist);color:var(--muted)}
.modal .ok{background:var(--risk);color:#fff}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px}
.loading{text-align:center;color:var(--muted);font-size:14px;padding:60px}
.loading .cv-spin{width:44px;height:44px;margin:0 auto 14px;animation:spin 2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* DARK MODE */
.btn-tema{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;width:38px;height:38px;font-size:16px;line-height:1;cursor:pointer;transition:var(--t);color:var(--ink);flex-shrink:0}
.btn-tema:hover{border-color:var(--azul)}
html.dark{color-scheme:dark;--ink:#e7eef6;--muted:#9bb0c2;--muted2:#7d92a5;--line:#293a4d;--mist:#16222f;--bg:#0e1722;--surface:#16242f;--brand-l:#17324a;--azul-d:#a9cbe8;--okbg:#15301f;--riskbg:#3a1d21;--warnbg:#3a2f17}
html.dark .sidebar{background:linear-gradient(180deg,#0d2a45,#124067)}
html.dark .topbar{background:rgba(18,30,42,.85)}

<script>
const sb = window.maisClient;
const money = (n)=>"R$ "+Math.round(Number(n||0)).toLocaleString("pt-BR");
const ini = (n)=>(n||"?").split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();
const cap = (s)=>s?s.charAt(0).toUpperCase()+s.slice(1):"";
const planClass=(s)=>s==="ind"?"ind":s==="gran"?"gran":"fam";
const planSlugNome=(n)=>/gran/i.test(n)?"gran":/individual/i.test(n)?"ind":"fam";
const stClass=(s)=>s==="ativo"?"ok":s==="cancelado"?"canc":"pend";
function dataHora(ts){
  if(!ts) return "—";
  const d=new Date(ts);
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
const labelPapel={gestor:"Gestor",financeiro:"Financeiro",recepcao:"Recepção"};
const D={};

/* ---- guarda ---- */
async function guard(){
  const {data}=await sb.auth.getSession();
  if(!data.session){location.href="/login/";return null;}
  const uid=data.session.user.id;
  tokenEq=data.session.access_token; meuId=uid;
  const {data:eq}=await sb.from("equipe").select("nome,papel,ativo,foto_path,must_change_password").eq("auth_user_id",uid).maybeSingle();
  if(!eq||!eq.ativo||!(eq.papel==="gestor"||eq.papel==="financeiro")){
    alert("Acesso restrito à equipe de gestão.");await sb.auth.signOut();location.href="/login/";return null;
  }
  return {...eq,uid};
}
async function sair(){await sb.auth.signOut();location.href="/login/";}

/* ---- carga ---- */
async function carregar(){
  const [k,mix,assin,cart,uso,fat,usoCard,planos,vend,com,prof]=await Promise.all([
    sb.from("vw_kpis_gestao").select("*").maybeSingle(),
    sb.from("vw_mix_planos").select("*"),
    sb.from("vw_assinantes_lista").select("*").order("data_adesao",{ascending:false}),
    sb.from("vw_cartoes_lista").select("*").order("numero_conta"),
    sb.from("vw_servicos_uso").select("*"),
    sb.from("vw_faturas_abertas").select("*"),
    sb.from("vw_uso_cartao").select("*"),
    sb.from("planos").select("nome,preco_mensal"),
    sb.from("equipe").select("auth_user_id,nome,comissao_valor").eq("ativo",true).order("nome"),
    sb.from("vw_comissoes").select("*").order("criado_em",{ascending:false}),
    sb.from("profissionais").select("*").order("nome"),
  ]);
  D.kpis=k.data||{};D.mix=mix.data||[];D.assin=assin.data||[];D.cart=cart.data||[];
  D.uso=uso.data||[];D.fat=fat.data||[];D.usoCard=usoCard.data||[];
  D.planos=planos.data||[];D.vendedores=vend.data||[];D.comissoes=com.data||[];D.profissionais=prof.data||[];
}

/* ================= DONUT ================= */
function donut(items,total,centerN,centerT){
  const R=58,C=2*Math.PI*R; let off=0;
  const segs=items.filter(i=>i.val>0).map(i=>{
    const frac=total>0?i.val/total:0; const len=frac*C;
    const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${i.cor}" stroke-width="20"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"
      stroke-linecap="butt"/>`; off+=len; return s;
  }).join("");
  return `<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150">
    <circle r="58" cx="75" cy="75" fill="none" stroke="#eef4fa" stroke-width="20"/>${segs}</svg>
    <div class="ctr"><div class="n">${centerN}</div><div class="t">${centerT}</div></div></div>`;
}

/* ================= SEÇÕES ================= */
function secGeral(){
  const k=D.kpis;
  const totAtivos=D.mix.reduce((s,m)=>s+Number(m.ativos||0),0);
  const dn=donut(D.mix.map(m=>({val:Number(m.ativos),cor:m.cor_hex})),totAtivos,totAtivos,"contas ativas");
  const leg=D.mix.map(m=>`<div class="it"><span class="dot" style="background:${m.cor_hex}"></span>${m.plano}<b>${m.ativos}</b><span>${m.pct||0}%</span></div>`).join("");
  // atenção: pendentes/inadimplentes
  const pend=D.assin.filter(a=>a.status!=="ativo");
  const attn=pend.length?pend.slice(0,5).map(a=>`<div class="it ${a.status==="cancelado"?"risk":"warn"}"><div class="ic">${a.status==="cancelado"?"✕":"⏳"}</div>
    <div class="tx"><b>${a.assinante}</b><small>${a.numero_conta} · ${cap(a.status)}</small></div>
    <div class="val">${money(a.economia_total)}</div></div>`).join(""):'<div class="empty" style="padding:18px">Tudo em dia. 🎉</div>';
  // próximas cobranças
  const fat=D.fat.slice(0,5).map(f=>`<div class="it ${f.vencida?"risk":"warn"}"><div class="ic">${f.vencida?"🔴":"📅"}</div>
    <div class="tx"><b>${f.assinante}</b><small>vence ${f.vencimento} · ${f.numero_conta}</small></div>
    <div class="val">${money(f.valor)}</div></div>`).join("")||'<div class="empty" style="padding:18px">Sem faturas em aberto.</div>';

  return `
  <div class="sec-h"><div><h1>Visão geral</h1><p>O pulso do programa Equilibrium Mais Saúde em tempo real</p></div></div>
  <div class="kpis">
    <div class="kpi c1"><div class="chip">👥</div><div class="v">${k.assinantes_ativos||0}</div><div class="l">Assinantes ativos</div><svg class="cvmini" viewBox="-55 -55 110 110"><use href="#cv-al"/></svg></div>
    <div class="kpi c2"><div class="chip">💵</div><div class="v">${money(k.mrr)}</div><div class="l">Receita recorrente / mês</div><svg class="cvmini" viewBox="-55 -55 110 110"><use href="#cv-al"/></svg></div>
    <div class="kpi c3"><div class="chip">💳</div><div class="v">${k.cartoes_ativos||0}</div><div class="l">Cartões ativos</div><svg class="cvmini" viewBox="-55 -55 110 110"><use href="#cv-al"/></svg></div>
    <div class="kpi c4"><div class="chip">⏳</div><div class="v">${k.inadimplentes||0}</div><div class="l">Pendentes / inadimplentes</div><svg class="cvmini" viewBox="-55 -55 110 110"><use href="#cv-al"/></svg></div>
  </div>
  <div class="grid g-2-1">
    <div class="card"><div class="ch"><h3>Economia gerada para a base</h3><span class="tag-soft">prova de valor</span></div>
      <div class="sub">Quanto o programa já devolveu em desconto aos clientes</div>
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
        <div><div style="font-family:'Quicksand';font-weight:700;font-size:44px;color:var(--ok);line-height:1">${money(k.economia_gerada_total)}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:4px">em ${k.total_atendimentos||0} atendimento(s)</div></div>
        <div style="flex:1;min-width:180px">
          <div class="barline"><div class="top"><b>Receita do programa (MRR)</b><span>${money(k.mrr)}</span></div><div class="track"><i style="width:100%"></i></div></div>
          <div class="barline"><div class="top"><b>Economia devolvida</b><span>${money(k.economia_gerada_total)}</span></div><div class="track"><i style="width:${Math.min(100,Math.round((Number(k.economia_gerada_total)/Math.max(1,Number(k.mrr)))*100))}%;background:linear-gradient(90deg,#1E8449,#27AE60)"></i></div></div>
        </div>
      </div>
    </div>
    <div class="card"><div class="ch"><h3>Mix de planos</h3></div><div class="sub">Distribuição da base ativa</div>
      <div class="donut-wrap">${dn}<div class="legend">${leg||'<div class="empty">Sem dados</div>'}</div></div>
    </div>
  </div>
  <div class="grid g-1-1">
    <div class="card"><div class="ch"><h3>Precisa de atenção</h3><span class="tag-soft">${pend.length}</span></div><div class="sub">Contas pendentes, inadimplentes ou canceladas</div><div class="attn">${attn}</div></div>
    <div class="card"><div class="ch"><h3>Próximas cobranças</h3><span class="tag-soft">${D.fat.length}</span></div><div class="sub">Faturas em aberto ordenadas por vencimento</div><div class="attn">${fat}</div></div>
  </div>`;
}

function secAssin(){
  const rows=D.assin.map(a=>`<tr class="clickable" onclick="abrirPerfil('${a.numero_conta}')">
    <td><div class="who"><div class="a" style="background:${a.plano_cor}">${ini(a.assinante)}</div><div>${a.assinante}<small>${a.cpf||""}</small></div></div></td>
    <td><span class="pill ${planClass(a.plano_slug)}">${a.plano_nome}</span></td>
    <td>${a.dependentes}</td><td>${a.numero_conta}</td><td>${a.proxima_cobranca||"—"}</td>
    <td class="dr-eco">${money(a.economia_total)}</td><td>${a.vendedor_nome||'—'}</td>
    <td><span class="stt ${stClass(a.status)}"><span class="d"></span>${cap(a.status)}</span></td>
    <td><span class="chev">›</span></td></tr>`).join("");
  return `
  <div class="sec-h"><div><h1>Assinantes</h1><p>${D.assin.length} conta(s) · clique para ver o perfil completo</p></div></div>
  <div class="toolbar"><div class="search">🔍 <input id="bAssin" placeholder="Buscar por nome, CPF ou conta..." oninput="fAssin()"></div>
    <div class="filt" id="fltAssin"><button class="on" data-f="todos">Todos</button><button data-f="ativo">Ativos</button><button data-f="pendente">Pendentes</button></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Assinante</th><th>Plano</th><th>Dep.</th><th>Conta</th><th>Próx. cobrança</th><th>Economia</th><th>Vendedor</th><th>Status</th><th></th></tr></thead>
  <tbody id="assinBody">${rows||'<tr><td colspan="9" class="empty">Nenhum assinante ainda.</td></tr>'}</tbody></table></div>`;
}
let fltAssinVal="todos";
function fAssin(){
  const q=(document.getElementById("bAssin").value||"").toLowerCase();
  let f=D.assin.filter(a=>(a.assinante||"").toLowerCase().includes(q)||(a.cpf||"").includes(q)||(a.numero_conta||"").toLowerCase().includes(q));
  if(fltAssinVal!=="todos")f=f.filter(a=>fltAssinVal==="ativo"?a.status==="ativo":a.status!=="ativo");
  document.getElementById("assinBody").innerHTML=f.map(a=>`<tr class="clickable" onclick="abrirPerfil('${a.numero_conta}')">
    <td><div class="who"><div class="a" style="background:${a.plano_cor}">${ini(a.assinante)}</div><div>${a.assinante}<small>${a.cpf||""}</small></div></div></td>
    <td><span class="pill ${planClass(a.plano_slug)}">${a.plano_nome}</span></td><td>${a.dependentes}</td><td>${a.numero_conta}</td><td>${a.proxima_cobranca||"—"}</td>
    <td class="dr-eco">${money(a.economia_total)}</td><td>${a.vendedor_nome||'—'}</td><td><span class="stt ${stClass(a.status)}"><span class="d"></span>${cap(a.status)}</span></td><td><span class="chev">›</span></td></tr>`).join("")||'<tr><td colspan="9" class="empty">Nada encontrado.</td></tr>';
}

/* ---- drawer perfil ---- */
function abrirPerfil(conta){
  const a=D.assin.find(x=>x.numero_conta===conta); if(!a)return;
  const cartoes=D.cart.filter(c=>c.numero_conta===conta);
  const faturas=D.fat.filter(f=>f.numero_conta===conta);
  const usos=D.usoCard.filter(u=>u.numero_cartao&&u.numero_cartao.startsWith(conta));
  const cartHtml=cartoes.map(c=>`<div class="dr-li"><div class="mini">${c.is_titular||c.papel==="Titular"?"⭐":"👤"}</div>
    <div class="g"><b>${c.titular_cartao}</b><small>${c.numero} · ${c.papel}</small></div>
    <div class="r"><span class="stt ${c.cartao_status==="ativo"&&c.adesao_status==="ativo"?"ok":"pend"}"><span class="d"></span>${c.cartao_status==="bloqueado"?"Bloq.":cap(c.adesao_status)}</span></div></div>`).join("")||'<div class="empty" style="padding:14px">—</div>';
  const usoHtml=usos.length?usos.slice(0,8).map(u=>`<div class="dr-li"><div class="mini">${u.icone||"🩺"}</div>
    <div class="g"><b>${u.servico}</b><small>${u.paciente} · ${u.data_uso}</small></div>
    <div class="r dr-eco">− ${money(u.economia)}</div></div>`).join(""):'<div class="empty" style="padding:14px">Sem atendimentos ainda.</div>';
  const fatHtml=faturas.length?faturas.map(f=>`<div class="dr-li"><div class="mini">${f.vencida?"🔴":"📅"}</div>
    <div class="g"><b>${money(f.valor)}</b><small>vence ${f.vencimento}</small></div>
    <div class="r"><span class="stt ${f.vencida?"canc":"pend"}"><span class="d"></span>${f.vencida?"Vencida":"Em aberto"}</span></div></div>`).join(""):'<div class="empty" style="padding:14px">Sem faturas em aberto. 🎉</div>';
  document.getElementById("drawer").innerHTML=`
    <div class="dr-head"><div class="cvbg" id="drCv"></div>
      <button class="x" onclick="fecharDrawer()">✕</button>
      <div class="who2"><div class="a">${ini(a.assinante)}</div><div><div class="nm">${a.assinante}</div><small>${a.numero_conta} · CPF ${a.cpf||"—"}</small></div></div>
    </div>
    <div class="dr-body">
      <div class="dr-stats">
        <div class="dr-stat"><div class="v">${a.plano_nome}</div><div class="l">Plano</div></div>
        <div class="dr-stat"><div class="v">${1+Number(a.dependentes||0)}</div><div class="l">Cartões</div></div>

async function confirmarPgto(adesaoId){
  const sel=document.getElementById("selVend"); const vendId=sel?sel.value:"";
  if(!(await uiConfirm("Isso ativa a conta do assinante e registra a comissão do vendedor.",{title:"Confirmar pagamento",okText:"Confirmar"}))) return;
  try{
    if(vendId){ const {error:e0}=await sb.rpc("definir_vendedor",{p_adesao_id:adesaoId,p_vendedor_id:vendId}); if(e0) throw e0; }
    const quem=(document.getElementById("uNome")?.textContent||"gestão").trim();
    const {data,error}=await sb.functions.invoke("confirmar-pagamento",{body:{adesao_id:adesaoId,gateway_ref:"manual:"+quem}});

/* ---- cartões agrupados ---- */
function agrupar(lista){const map={},ordem=[],v={};lista.forEach(c=>{const k=c.numero_conta;if(!map[k]){map[k]={conta:k,titular:null,deps:[],plano_slug:c.plano_slug,plano_nome:c.plano_nome};}if(c.is_titular||c.papel==="Titular")map[k].titular=c;else map[k].deps.push(c);if(!v[k]){v[k]=1;ordem.push(k);}});return ordem.map(k=>map[k]);}
function lStatus(cs,as){const ok=cs==="ativo"&&as==="ativo";return `<span class="stt ${cs==="bloqueado"?"pend":ok?"ok":"pend"}"><span class="d"></span>${cs==="bloqueado"?"Bloqueado":cap(as)}</span>`;}
function secCart(){
  const grupos=agrupar(D.cart);
  return `<div class="sec-h"><div><h1>Cartões</h1><p>${grupos.length} conta(s) · ${D.cart.length} cartão(ões) emitido(s)</p></div></div>
  <div class="toolbar"><div class="search">🔍 <input id="bCart" placeholder="Buscar por nome ou nº do cartão..." oninput="fCart()"></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Nº do cartão</th><th>Titular / membro</th><th>Papel</th><th>Conta (titular)</th><th>Plano</th><th>Status</th></tr></thead>
  <tbody id="cartBody">${bodyCart(grupos)}</tbody></table></div>`;
}
function bodyCart(grupos){return grupos.map((g,i)=>{
  const t=g.titular||g.deps[0];const nDep=g.deps.length;const total=(g.titular?1:0)+nDep;const temDep=nDep>0;
  const resumo=temDep?`<span class="resumo">+${nDep} dependente${nDep>1?"s":""} · ${total} cartões</span>`:"";
  const cab=`<tr class="conta-row" ${temDep?`onclick="toggleConta(${i})" style="cursor:pointer"`:""}><td><span class="arrow ${temDep?"":"none"}" id="arr-${i}">▶</span><b>${t?t.numero:g.conta}</b></td><td>${t?t.titular_cartao:"—"}${resumo}</td><td>Titular</td><td>${t?t.conta_titular:"—"}</td><td><span class="pill ${planClass(g.plano_slug)}">${g.plano_nome}</span></td><td>${t?lStatus(t.cartao_status,t.adesao_status):""}</td></tr>`;
  const filhos=g.deps.map(d=>`<tr class="dep-row dep-of-${i} hidden"><td>${d.numero}</td><td>${d.titular_cartao}</td><td>${d.papel}</td><td></td><td><span class="pill ${planClass(d.plano_slug)}">${d.plano_nome}</span></td><td>${lStatus(d.cartao_status,d.adesao_status)}</td></tr>`).join("");
  return cab+filhos;}).join("")||'<tr><td colspan="6" class="empty">Nenhum cartão emitido.</td></tr>';}
function toggleConta(i){const a=document.getElementById("arr-"+i);if(a)a.classList.toggle("open");document.querySelectorAll(".dep-of-"+i).forEach(r=>r.classList.toggle("hidden"));}
function fCart(){const q=(document.getElementById("bCart").value||"").toLowerCase();const body=document.getElementById("cartBody");if(!q){body.innerHTML=bodyCart(agrupar(D.cart));return;}const f=D.cart.filter(c=>(c.titular_cartao||"").toLowerCase().includes(q)||(c.numero||"").toLowerCase().includes(q));body.innerHTML=f.map(c=>`<tr><td><b>${c.numero}</b></td><td>${c.titular_cartao}</td><td>${c.papel}</td><td>${c.conta_titular}</td><td><span class="pill ${planClass(c.plano_slug)}">${c.plano_nome}</span></td><td>${lStatus(c.cartao_status,c.adesao_status)}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">Nada encontrado.</td></tr>';}

function secFin(){

  <div class="kpis">
    <div class="kpi c2"><div class="chip">💵</div><div class="v">${money(k.mrr)}</div><div class="l">MRR · receita recorrente</div></div>

    <div class="kpi c3"><div class="chip">⏳</div><div class="v">${money(totalAberto)}</div><div class="l">A receber (em aberto)</div></div>
    <div class="kpi c4"><div class="chip">🔴</div><div class="v">${vencidas}</div><div class="l">Faturas vencidas</div></div>
  </div>
  <div class="grid g-2-1">
    <div class="card"><div class="ch"><h3>Faturas em aberto</h3><span class="tag-soft">${D.fat.length}</span></div><div class="sub">Ordenadas por vencimento</div>
      <div class="tbl-wrap" style="border:none"><table><thead><tr><th>Assinante</th><th>Conta</th><th>Plano</th><th>Comp.</th><th>Venc.</th><th>Valor</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Nenhuma fatura em aberto. 🎉</td></tr>'}</tbody></table></div></div>
    <div class="card"><div class="ch"><h3>Receita por plano</h3></div><div class="sub">Composição do MRR</div>${recRows}</div>
  </div>`;
}

function secUso(){

async function criarMembro(){

  document.getElementById("cred").classList.remove("show");

    const res=await callFnEquipe({acao:"criar",nome,email,papel:papelSel});

    document.getElementById("credSenha").textContent=res.senha_provisoria;
    document.getElementById("cred").classList.add("show");
    document.getElementById("f_nome").value=""; document.getElementById("f_email").value="";
    await carregarEquipe();
  }catch(e){show("Erro: "+(e.message||e),"err");}
  finally{btn.disabled=false;btn.textContent="Criar acesso";}
}

function secComissoes(){
  const vend=D.vendedores||[]; const coms=D.comissoes||[];
  const cfgRows=vend.map(v=>`<div class="dr-li"><div class="g"><b>${v.nome}</b><small>comissão fixa por adesão</small></div>
    <div class="r" style="display:flex;gap:8px;align-items:center">R$ <input type="number" min="0" step="1" id="cv_${v.auth_user_id}" value="${Number(v.comissao_valor||0)}" style="width:90px;padding:8px;border:1px solid var(--line);border-radius:8px">
    <button onclick="salvarComissao('${v.auth_user_id}')" style="padding:8px 12px;border:none;border-radius:8px;background:var(--azul);color:#fff;cursor:pointer;font-weight:600">Salvar</button></div></div>`).join("")||'<div class="empty" style="padding:14px">Nenhum vendedor na equipe.</div>';
  const porVend={};
  coms.forEach(c=>{const k=c.vendedor_nome||"— sem vendedor —"; (porVend[k]=porVend[k]||[]).push(c);});
  const totRec=coms.filter(c=>c.status!=="pago").reduce((a,c)=>a+Number(c.valor||0),0);
  const totPago=coms.filter(c=>c.status==="pago").reduce((a,c)=>a+Number(c.valor||0),0);
  const grupos=Object.keys(porVend).map(nome=>{
    const lista=porVend[nome];
    const rec=lista.filter(c=>c.status!=="pago").reduce((a,c)=>a+Number(c.valor||0),0);
    const linhas=lista.map(c=>`<tr>
      <td>${c.assinante_nome||"—"}<small style="display:block;color:var(--muted)">${c.numero_conta||""} ${c.plano_nome?("· "+c.plano_nome):""}</small></td>
      <td>${c.criado_em?String(c.criado_em).slice(0,10):"—"}</td>
      <td>${money(c.valor)}</td>
      <td>${c.status==="pago"?'<span class="stt ok"><span class="d"></span>Pago</span>':'<span class="stt pend"><span class="d"></span>A receber</span>'}</td>
      <td style="text-align:right">${c.status!=="pago"?`<button onclick="pagarComissao('${c.id}')" style="padding:7px 12px;border:none;border-radius:8px;background:#1E8449;color:#fff;cursor:pointer">Marcar pago</button>`:"—"}</td></tr>`).join("");
    return `<div class="card" style="padding:0;overflow:hidden;margin-top:16px">
      <div style="padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${nome}</h3><span class="tag-soft">A receber: ${money(rec)}</span></div>
      <div class="tbl-wrap" style="border:none;border-radius:0"><table><thead><tr><th>Assinante</th><th>Data</th><th>Valor</th><th>Status</th><th style="text-align:right">Ação</th></tr></thead>
      <tbody>${linhas}</tbody></table></div></div>`;
  }).join("")||'<div class="empty" style="padding:20px">Nenhuma comissão gerada ainda. Elas nascem quando um pagamento é confirmado com um vendedor.</div>';
  return `<div class="sec-h"><div><h1>Comissões</h1><p>Configure o valor por vendedor e pague as comissões das vendas</p></div></div>
  <div class="dr-stats" style="margin-bottom:18px">
    <div class="dr-stat"><div class="v" style="color:var(--ambar-d,#B7791F)">${money(totRec)}</div><div class="l">A receber</div></div>
    <div class="dr-stat"><div class="v" style="color:var(--ok)">${money(totPago)}</div><div class="l">Já pago</div></div></div>
  <div class="card" style="margin-bottom:8px"><div class="ch"><h3>Valor da comissão por vendedor</h3></div>
    <div class="sub">Valor fixo pago por adesão confirmada. Deixe 0 para não gerar comissão.</div>${cfgRows}</div>
  ${grupos}`;
}
async function salvarComissao(authId){
  const inp=document.getElementById("cv_"+authId); if(!inp)return;
  const val=parseFloat(inp.value||"0")||0;
  try{ const {error}=await sb.rpc("definir_comissao",{p_auth_user_id:authId,p_valor:val}); if(error) throw error;
    inp.style.borderColor="#1E8449"; const v=(D.vendedores||[]).find(x=>x.auth_user_id===authId); if(v) v.comissao_valor=val;
  }catch(e){ alert("Erro ao salvar: "+(e.message||e)); }
}
async function pagarComissao(comId){
  if(!(await uiConfirm("Marcar esta comissão como paga?",{title:"Comissão",okText:"Marcar pago"}))) return;
  try{ const {error}=await sb.rpc("pagar_comissao",{p_comissao_id:comId,p_pago_por:meuId||null}); if(error) throw error;
    const {data}=await sb.from("vw_comissoes").select("*").order("criado_em",{ascending:false}); D.comissoes=data||[]; mostrar("comis");
  }catch(e){ alert("Erro: "+(e.message||e)); }
}

function secProfissionais(){
  const list=D.profissionais||[];
  const rows=list.length?list.map(p=>`<tr>
    <td>${p.nome||"—"}</td><td>${p.especialidade||"—"}</td><td>${p.registro||"—"}</td>
    <td>${p.ativo?'<span class="stt ok"><span class="d"></span>Ativo</span>':'<span class="stt pend"><span class="d"></span>Inativo</span>'}</td>
    <td style="text-align:right"><button onclick="toggleProf('${p.id}',${p.ativo?'false':'true'})" style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer">${p.ativo?"Desativar":"Ativar"}</button></td></tr>`).join("")
    :'<tr><td colspan="5" class="empty" style="padding:16px">Nenhum profissional cadastrado.</td></tr>';
  return `<div class="sec-h"><div><h1>Profissionais</h1><p>Cadastre os profissionais que atendem — eles aparecem na recepção ao registrar o atendimento</p></div></div>
  <div class="eq-grid">
    <div class="card">
      <div class="ch"><h3>Novo profissional</h3></div>
      <div class="sub">Médico, psicólogo, terapeuta… quem presta o atendimento.</div>
      <div class="field"><label>Nome completo</label><input id="p_nome" placeholder="Nome do profissional"></div>
      <div class="field"><label>Especialidade</label><input id="p_esp" placeholder="Ex.: Psicologia, Fonoaudiologia, Pediatria"></div>
      <div class="field"><label>Registro / Conselho (opcional)</label><input id="p_reg" placeholder="Ex.: CRP 04/12345, CRM-MG 00000"></div>
      <button class="btn-full" onclick="salvarProfissional()">Cadastrar profissional</button>
      <div class="msg" id="msgProf"></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:22px 22px 14px"><div class="ch"><h3>Profissionais cadastrados</h3><span class="tag-soft">${list.filter(p=>p.ativo).length} ativo(s)</span></div></div>
      <div class="tbl-wrap" style="border:none;border-radius:0"><table>
        <thead><tr><th>Nome</th><th>Especialidade</th><th>Registro</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
  </div>`;
}
async function salvarProfissional(){
  const g=id=>(document.getElementById(id)?.value||"").trim();
  const nome=g("p_nome"), esp=g("p_esp"), reg=g("p_reg");
  const msg=document.getElementById("msgProf");
  if(!nome){ if(msg)msg.textContent="Informe o nome do profissional."; return; }
  try{
    const {error}=await sb.rpc("salvar_profissional",{p_nome:nome,p_especialidade:esp,p_registro:reg}); if(error) throw error;
    const {data}=await sb.from("profissionais").select("*").order("nome"); D.profissionais=data||[]; mostrar("prof");
  }catch(e){ if(msg)msg.textContent="Erro ao cadastrar: "+(e.message||e); }
}
async function toggleProf(id,novo){
  try{
    const {error}=await sb.rpc("set_profissional_ativo",{p_id:id,p_ativo:novo}); if(error) throw error;
    const {data}=await sb.from("profissionais").select("*").order("nome"); D.profissionais=data||[]; mostrar("prof");
  }catch(e){ alert("Erro: "+(e.message||e)); }
}

function secAtendimentos(){
  const hoje=new Date().toISOString().slice(0,10); const prim=hoje.slice(0,8)+"01";
  return `<div class="sec-h"><div><h1>Atendimentos</h1><p>Registro de tudo que foi executado — paciente, serviço, profissional e data</p></div></div>
  <div class="card" style="margin-bottom:16px"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <label style="font-size:12px;color:var(--muted);font-weight:600">De<br><input type="date" id="aDe" value="${prim}" style="margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px"></label>
    <label style="font-size:12px;color:var(--muted);font-weight:600">Até<br><input type="date" id="aAte" value="${hoje}" style="margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px"></label>
    <button class="btn-full" style="width:auto;padding:10px 18px;margin:0" onclick="buscarAtendimentos()">🔎 Buscar período</button>
    <input id="qAtend" placeholder="Buscar paciente, serviço, profissional…" oninput="filtrarAtend()" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px">
  </div></div>
  <div class="dr-stats" style="margin-bottom:16px">
    <div class="dr-stat"><div class="v" id="atTot">0</div><div class="l">Atendimentos</div></div>
    <div class="dr-stat"><div class="v" style="color:var(--ok)" id="atEco">R$ 0</div><div class="l">Economia gerada</div></div>
    <div class="dr-stat"><div class="v" id="atRec">R$ 0</div><div class="l">Recebido (c/ cartão)</div></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap" style="border:none;border-radius:0"><table>
    <thead><tr><th>Data</th><th>Paciente</th><th>Serviço</th><th>Profissional</th><th>Valor pago</th><th>Economia</th></tr></thead>
    <tbody id="atendBody"><tr><td colspan="6" class="loading">Carregando…</td></tr></tbody>
  </table></div></div>`;
}
async function buscarAtendimentos(){
  const de=(document.getElementById("aDe")?.value)||new Date().toISOString().slice(0,10);
  const ate=(document.getElementById("aAte")?.value)||de;
  if(de>ate){ alert("A data inicial não pode ser maior que a final."); return; }
  const body=document.getElementById("atendBody"); if(body) body.innerHTML='<tr><td colspan="6" class="loading">Buscando…</td></tr>';
  const {data,error}=await sb.from("vw_atendimentos").select("*").gte("data_uso",de).lte("data_uso",ate).order("data_uso",{ascending:false}).order("hora",{ascending:false});
  if(error){ if(body) body.innerHTML='<tr><td colspan="6" class="empty">Erro ao buscar: '+(error.message||error)+'</td></tr>'; return; }
  D.atendimentos=data||[]; const q=document.getElementById("qAtend"); if(q) q.value=""; pintarAtend(D.atendimentos);
}
function filtrarAtend(){
  const raw=(document.getElementById("qAtend")?.value||"").trim().toLowerCase();
  const f=(D.atendimentos||[]).filter(u=>(u.paciente||"").toLowerCase().includes(raw)||(u.servico||"").toLowerCase().includes(raw)||(u.profissional||"").toLowerCase().includes(raw)||(u.protocolo||"").toLowerCase().includes(raw));
  pintarAtend(f);
}
function pintarAtend(lista){
  const body=document.getElementById("atendBody"); if(!body) return;
  const eco=lista.reduce((s,u)=>s+Number(u.economia||0),0), rec=lista.reduce((s,u)=>s+Number(u.valor_pago||0),0);
  const st=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v;};
  st("atTot",lista.length); st("atEco",money(eco)); st("atRec",money(rec));
  if(!lista.length){ body.innerHTML='<tr><td colspan="6" class="empty" style="padding:18px">Nenhum atendimento no período.</td></tr>'; return; }
  body.innerHTML=lista.map(u=>`<tr>
    <td>${u.data_uso||"—"}${u.hora?(" "+String(u.hora).slice(0,5)):""}</td>
    <td>${u.paciente||"—"}<small style="display:block;color:var(--muted)">${u.numero_cartao||""}${u.protocolo?(" · "+u.protocolo):""}</small></td>
    <td>${u.servico||u.servico_slug||"—"}</td>
    <td>${u.profissional||"—"}${u.especialidade?('<small style="display:block;color:var(--muted)">'+u.especialidade+'</small>'):""}</td>
    <td>${money(u.valor_pago)}</td>
    <td style="color:var(--ok)">${money(u.economia)}</td></tr>`).join("");
}
const SEC={geral:{f:secGeral,t:"Visão geral"},assin:{f:secAssin,t:"Assinantes"},cart:{f:secCart,t:"Cartões"},fin:{f:secFin,t:"Financeiro"},uso:{f:secUso,t:"Uso & Benefícios"},atend:{f:secAtendimentos,t:"Atendimentos"},comis:{f:secComissoes,t:"Comissões"},prof:{f:secProfissionais,t:"Profissionais"},equipe:{f:secEquipe,t:"Equipe"}};
function mostrar(s){
  document.getElementById("content").innerHTML=SEC[s].f();
  document.getElementById("crumbSec").textContent=SEC[s].t;
  document.querySelectorAll("#sbNav button").forEach(b=>b.classList.toggle("on",b.dataset.sec===s));
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("content").scrollTo?.(0,0);
  // re-vincula filtros
  if(s==="assin")document.querySelectorAll("#fltAssin button").forEach(b=>b.onclick=()=>{fltAssinVal=b.dataset.f;document.querySelectorAll("#fltAssin button").forEach(x=>x.classList.toggle("on",x===b));fAssin();});
  if(s==="equipe")bindEquipe();
  if(s==="atend")buscarAtendimentos();
}

/* cataventos decorativos */
function plantarCv(hostId,n,op){
  const host=document.getElementById(hostId);if(!host)return;host.innerHTML="";const NS="http://www.w3.org/2000/svg";
  const pos=[[8,14,70,11],[78,20,52,9],[40,68,46,13],[88,72,40,8],[20,80,38,10],[60,8,44,12]];
  for(let i=0;i<n;i++){const p=pos[i%pos.length];const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","-55 -55 110 110");s.setAttribute("width",p[2]);s.setAttribute("height",p[2]);s.classList.add("cv");s.style.left=p[0]+"%";s.style.top=p[1]+"%";s.style.setProperty("--sp",p[3]+"s");s.style.opacity=op;if(i%2)s.style.animationDirection="reverse";const u=document.createElementNS(NS,"use");u.setAttribute("href","#cv-white");s.appendChild(u);host.appendChild(s);}
}

let EU = null; // dados do membro logado
async function renderAvatar(){

  av.innerHTML=`${ini(EU.nome)}<span class="badge-foto">!</span><div class="cam">📷</div>`;
}
function abrirCropFoto(){
  CortexFoto.abrir({
    bucketFolder:"equipe", tabela:"equipe", coluna:"foto_path",
    chaveColuna:"auth_user_id", chaveValor:EU.uid,
    onPronto:(url)=>{ EU.foto_path=`equipe/${EU.uid}.png`; renderAvatar(); }
  });
}

/* ================= BOOT ================= */
(async()=>{
  const eq=await guard();if(!eq)return;
  EU=eq;
  document.getElementById("uNome").textContent=eq.nome;
  document.getElementById("uRole").textContent=labelPapel[eq.papel]||cap(eq.papel);

  // botão "Ir para recepção" só para o gestor

})();
